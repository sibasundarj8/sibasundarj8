name: Generate Profile Cards

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate local analytics cards
        run: python3 scripts/generate-profile-cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update profile analytics cards"
          file_pattern: assets/github-stats-card.svg assets/top-langs-card.svg
