name: Generate GitHub Space Shooter

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Install renderer dependency
        run: python3 -m pip install pillow

      - name: Generate real contribution arcade GIF
        run: python3 scripts/generate-contribution-arcade.py

      - name: Commit generated arcade GIF
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update contribution arcade"
          file_pattern: assets/gh-space-shooter.gif
