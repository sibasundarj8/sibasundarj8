<svg width="1600" height="132" viewBox="0 0 1600 132" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Terminal Style Separator</title>
  <desc id="desc">A minimal dark terminal-inspired separator for backend engineering profile sections.</desc>
  <defs>
    <linearGradient id="terminal-bg" x1="0" y1="0" x2="1600" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="terminal-line" x1="100" y1="66" x2="1500" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.22" stop-color="#1F6FEB"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="0.78" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="terminal-glow" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .term { font: 600 18px JetBrains Mono, Consolas, Menlo, monospace; fill: #CBD5E1; }
      .muted { fill: #64748B; }
    </style>
  </defs>

  <rect width="1600" height="132" fill="url(#terminal-bg)"/>
  <path d="M100 66H1500" stroke="url(#terminal-line)" stroke-width="1.6"/>
  <g transform="translate(112 36)">
    <rect width="420" height="60" rx="14" fill="#0A0F16" stroke="#243041"/>
    <circle cx="28" cy="30" r="6" fill="#EF4444"/>
    <circle cx="50" cy="30" r="6" fill="#F59E0B"/>
    <circle cx="72" cy="30" r="6" fill="#22C55E"/>
    <text x="106" y="37" class="term"><tspan fill="#00E5FF">$</tspan> <tspan class="muted">systemctl</tspan> status backend</text>
    <rect x="382" y="20" width="8" height="22" rx="3" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g filter="url(#terminal-glow)">
    <circle r="4.5" fill="#FFFFFF">
      <animateMotion dur="3.8s" repeatCount="indefinite" path="M542 66H1500"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
