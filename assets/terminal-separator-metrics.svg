<svg width="1600" height="118" viewBox="0 0 1600 118" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Terminal Metrics Separator</title>
  <desc id="desc">A professional terminal separator with latency, throughput, and uptime metrics.</desc>
  <defs>
    <linearGradient id="metrics-bg" x1="0" y1="0" x2="1600" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="metrics-line" x1="80" y1="59" x2="1520" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <style>
      .key { font: 700 14px JetBrains Mono, Consolas, Menlo, monospace; fill: #64748B; }
      .val { font: 700 16px JetBrains Mono, Consolas, Menlo, monospace; fill: #E6EDF3; }
      .accent { fill: #00E5FF; }
    </style>
  </defs>

  <rect width="1600" height="118" fill="url(#metrics-bg)"/>
  <path d="M80 59H1520" stroke="url(#metrics-line)" stroke-width="1.4"/>

  <g transform="translate(150 29)">
    <rect width="230" height="60" rx="12" fill="#0A0F16" stroke="#243041"/>
    <text x="22" y="37" class="key">p95_latency</text>
    <text x="138" y="37" class="val">42ms</text>
  </g>
  <g transform="translate(480 29)">
    <rect width="250" height="60" rx="12" fill="#0A0F16" stroke="#243041"/>
    <text x="22" y="37" class="key">throughput</text>
    <text x="132" y="37" class="val">18k rpm</text>
  </g>
  <g transform="translate(830 29)">
    <rect width="250" height="60" rx="12" fill="#0A0F16" stroke="#243041"/>
    <text x="22" y="37" class="key">uptime</text>
    <text x="104" y="37" class="val">99.95%</text>
  </g>
  <g transform="translate(1180 29)">
    <rect width="270" height="60" rx="12" fill="#0A0F16" stroke="#243041"/>
    <text x="22" y="37" class="key">deploy</text>
    <text x="98" y="37" class="val">green</text>
    <circle cx="192" cy="31" r="7" class="accent">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
