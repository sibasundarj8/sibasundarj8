<svg width="1600" height="300" viewBox="0 0 1600 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JVM Inspired Neon Dark Footer</title>
  <desc id="desc">A clean dark footer inspired by JVM bytecode, memory segments, and neon backend infrastructure.</desc>
  <defs>
    <linearGradient id="jvm-bg" x1="0" y1="0" x2="1600" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset="0.5" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#051318"/>
    </linearGradient>
    <linearGradient id="jvm-line" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="jvm-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .byte { font: 600 16px JetBrains Mono, Consolas, Menlo, monospace; fill: #64748B; }
      .jvm-title { font: 800 30px Inter, Segoe UI, Arial, sans-serif; fill: #E6EDF3; }
      .jvm-sub { font: 500 16px JetBrains Mono, Consolas, Menlo, monospace; fill: #94A3B8; }
    </style>
  </defs>

  <rect width="1600" height="300" fill="url(#jvm-bg)"/>
  <path d="M0 36H1600" stroke="url(#jvm-line)" stroke-width="1.5"/>
  <path d="M0 264H1600" stroke="url(#jvm-line)" stroke-width="1.5"/>

  <g opacity="0.36">
    <text x="84" y="94" class="byte">aload_0</text>
    <text x="238" y="94" class="byte">invokevirtual</text>
    <text x="448" y="94" class="byte">getfield</text>
    <text x="604" y="94" class="byte">ifnonnull</text>
    <text x="794" y="94" class="byte">monitorenter</text>
    <text x="1024" y="94" class="byte">ireturn</text>
    <text x="1190" y="94" class="byte">invokedynamic</text>
    <text x="1428" y="94" class="byte">astore</text>
  </g>

  <g transform="translate(250 132)">
    <rect width="1100" height="76" rx="18" fill="#0A0F16" stroke="#243041"/>
    <g filter="url(#jvm-glow)">
      <rect x="34" y="24" width="210" height="28" rx="8" fill="#1F6FEB" opacity="0.28"/>
      <rect x="266" y="24" width="170" height="28" rx="8" fill="#00E5FF" opacity="0.34"/>
      <rect x="458" y="24" width="250" height="28" rx="8" fill="#2DD4BF" opacity="0.28"/>
      <rect x="730" y="24" width="142" height="28" rx="8" fill="#1F6FEB" opacity="0.28"/>
      <rect x="894" y="24" width="172" height="28" rx="8" fill="#00E5FF" opacity="0.26"/>
    </g>
    <text x="550" y="-28" text-anchor="middle" class="jvm-title">JVM • APIs • Distributed Systems</text>
    <text x="550" y="114" text-anchor="middle" class="jvm-sub">heap · stack · threads · bytecode · services · telemetry</text>
  </g>

  <g filter="url(#jvm-glow)">
    <circle cx="524" cy="170" r="5" fill="#FFFFFF">
      <animate attributeName="cx" values="284;510;702;976;1316" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="894" cy="170" r="5" fill="#00E5FF">
      <animate attributeName="cx" values="510;702;976;1316" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
